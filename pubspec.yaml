name: medical_app
description: "Opt Doctor Assistance Intelligence — offline-first clinical records with an on-device assistant."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  # Utf8 marshalling for the on-device language model's four-function C shim
  # (native/llm_shim). Already in the tree transitively; direct because we
  # call it directly.
  ffi: ^2.1.0
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  # Pinned below 11.x deliberately: 11.0.0 declares `compileSdk = 37` in its
  # AAR metadata, which forces every consumer to compile against API 37 — but
  # Android Gradle Plugin 9.0.1 caps out at 36, and the SDK manager installs
  # that platform as `android-37.0`, which AGP cannot resolve either way.
  # 10.3.1 has the same Dart API and builds cleanly. Revisit when AGP supports 37.
  flutter_secure_storage: ^10.3.1
  go_router: ^17.5.0
  # On-device, offline text recognition (Latin script). Bundles its model into
  # the app — no network, nothing leaves the device, the same rule the speech
  # and language models follow.
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  provider: ^6.1.5+1
  record: ^7.1.1
  sherpa_onnx: ^1.13.6
  sqflite_sqlcipher: ^3.4.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

# ML Kit is the Android OCR path only — iOS uses Apple Vision natively (see
# data/services/ocr/text_scanner.dart). These vendored copies are the pub.dev
# packages with the iOS implementation removed, so the ML Kit pods (which ship
# no arm64-simulator slice and would break iOS simulator builds) never enter
# the iOS build at all.
dependency_overrides:
  google_mlkit_commons:
    path: packages/google_mlkit_commons
  google_mlkit_text_recognition:
    path: packages/google_mlkit_text_recognition

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true

  # Appearance tokens. Widget code reads colours, spacing and radii from here
  # rather than hardcoding them, so the whole app can be re-skinned by editing
  # a single file.
  assets:
    - assets/theme/

# ---------------------------------------------------------------------------
# App icon. Regenerate after changing assets/branding/icon*.png:
#   dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: "launcher_icon"
  # Adaptive icon: the OS masks the foreground to a circle/squircle, so the
  # mark is scaled into the inner safe zone rather than filling the canvas.
  adaptive_icon_background: "#0F6473"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_foreground.png"
  min_sdk_android: 24
  ios: true
  remove_alpha_ios: true

# ---------------------------------------------------------------------------
# Splash screen. Regenerate after changing the logo:
#   dart run flutter_native_splash:create
# The colour matches the theme's primary so the handoff from splash to the
# lock screen has no flash of a different background.
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#0F6473"
  image: "assets/branding/splash_logo.png"
  color_dark: "#16292E"
  image_dark: "assets/branding/splash_logo_dark.png"
  android_12:
    color: "#0F6473"
    image: "assets/branding/icon_foreground.png"
    color_dark: "#16292E"
    image_dark: "assets/branding/splash_logo_dark.png"
  android: true
  ios: true
