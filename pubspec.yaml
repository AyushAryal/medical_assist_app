name: medical_app
description: "Opt Doctor Assistance Intelligence — offline-first clinical records with an on-device assistant."
publish_to: 'none'
version: 1.0.0+15

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  # Utf8 marshalling for the on-device language model's four-function C shim
  # (native/llm_shim). Already in the tree transitively; direct because we
  # call it directly.
  ffi: ^2.1.0
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  # Pinned below 11.x deliberately: 11.0.0 declares `compileSdk = 37` in its
  # AAR metadata, which forces every consumer to compile against API 37 — but
  # Android Gradle Plugin 9.0.1 caps out at 36, and the SDK manager installs
  # that platform as `android-37.0`, which AGP cannot resolve either way.
  # 10.3.1 has the same Dart API and builds cleanly. Revisit when AGP supports 37.
  flutter_secure_storage: ^10.3.1
  go_router: ^17.5.0
  # On-device, offline text recognition (Latin script). Bundles its model into
  # the app — no network, nothing leaves the device, the same rule the speech
  # and language models follow.
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  # The shared OptERP family kit: the co-brand credit, canonical detail/stat
  # primitives and the research-backed trend charts. Path dependency, no
  # override — the kit's file_picker constraint now spans 8.x–12.x.
  opt_kit:
    path: ../opt_kit
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  provider: ^6.1.5+1
  record: ^7.1.1
  sherpa_onnx: ^1.13.6
  sqflite_sqlcipher: ^3.4.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

# ML Kit is the Android OCR path only — iOS uses Apple Vision natively (see
# data/services/ocr/text_scanner.dart). These vendored copies are the pub.dev
# packages with the iOS implementation removed, so the ML Kit pods (which ship
# no arm64-simulator slice and would break iOS simulator builds) never enter
# the iOS build at all.
dependency_overrides:
  google_mlkit_commons:
    path: packages/google_mlkit_commons
  google_mlkit_text_recognition:
    path: packages/google_mlkit_text_recognition

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true

  # Appearance tokens. Widget code reads colours, spacing and radii from here
  # rather than hardcoding them, so the whole app can be re-skinned by editing
  # a single file.
  assets:
    - assets/theme/
    # Brand marks shown on the Dart launch splash (see core/branding) — the
    # white glyph (icon_foreground) is the splash mark; icon.png is the full
    # gradient icon used in-app (e.g. about/settings).
    - assets/branding/icon.png
    - assets/branding/icon_foreground.png

# ---------------------------------------------------------------------------
# App icon. Regenerate after changing assets/branding/icon*.png:
#   dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: "launcher_icon"
  # Adaptive icon: the OS masks the foreground to a circle/squircle, so the
  # mark is scaled into the inner safe zone rather than filling the canvas.
  adaptive_icon_background: "#6C4FD8"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_foreground.png"
  min_sdk_android: 24
  ios: true
  remove_alpha_ios: true

# ---------------------------------------------------------------------------
# Splash screen. Regenerate after changing the logo:
#   dart run flutter_native_splash:create
# The colour matches the theme's primary (family violet) so the handoff from
# the instant native splash to the Dart family splash has no colour flash.
# ---------------------------------------------------------------------------
flutter_native_splash:
  # Full-screen family gradient so the pre-Flutter launch matches the Dart
  # splash exactly (same coral->violet->blue backdrop + white glyph) — no
  # background or logo jump between the two stages. The family splash is the
  # BRIGHT gradient in BOTH modes (OptHealth/OptIVF splashes don't dim in dark
  # mode — it's a brand moment), so light and dark use the same image. The
  # solid colour is only the fallback (mid-gradient violet) where an image
  # can't be painted (the Android 12+ behind-icon area, below).
  #
  # NOTE: do NOT add top-level `color`/`color_dark` here — flutter_native_splash
  # treats colour and background_image as mutually exclusive and silently lets
  # the colour WIN (it writes a 1x1 solid pixel as LaunchBackground and ignores
  # the image; see ios.dart _createBackground `if (color) … else if (image)`).
  # That was the "solid dark violet native splash" bug.
  background_image: "assets/branding/splash_bg.png"
  image: "assets/branding/icon_foreground.png"
  background_image_dark: "assets/branding/splash_bg.png"
  image_dark: "assets/branding/icon_foreground.png"
  android_12:
    color: "#7B5FD6"
    image: "assets/branding/icon_foreground.png"
    color_dark: "#7B5FD6"
    image_dark: "assets/branding/icon_foreground.png"
  android: true
  ios: true
